    }

    const trimmed = identifier.trim().toLowerCase();
    const cleanNumber = identifier.replace(/[^0-9]/g, '');

    const user = users.find(
      (u) =>
        u.username.toLowerCase() === trimmed ||
        (u.email && u.email.toLowerCase() === trimmed) ||
        (cleanNumber.length >= 7 && u.phone && u.phone.replace(/[^0-9]/g, '') === cleanNumber)
    );

    if (!user) {
      return { success: false, message: 'Account not found. Please verify your username, email, or contact number.' };
    }

    if (user.status === 'inactive') {
      return { success: false, message: 'This account has been deactivated. Please contact station management.' };
    }

    const expectedPassword = user.password || 'password123';
    if (password !== expectedPassword) {

    }

    setCurrentUserId(user.id);
    setIsAuthenticated(true);

  const loginAsCustomer = (identifier, password) => {
    if (!identifier || !identifier.trim()) {

    }
    if (!password) {
      return { success: false, message: 'Please enter your customer password to protect account security.' };
    }

    const query = identifier.trim().toLowerCase();
    const cleanQuery = identifier.replace(/[^0-9]/g, '');

    // 1. Look for existing customer user record in users
    let custUser = users.find(
      (u) =>
        u.role === 'customer' &&
        (u.username.toLowerCase() === query ||
          (u.email && u.email.toLowerCase() === query) ||
          (cleanQuery.length >= 7 && u.phone && u.phone.replace(/[^0-9]/g, '') === cleanQuery))
    );

    // 2. If not found in users, look in customers list
    if (!custUser) {
      const customer = customers.find(
        (c) =>
          c.id.toLowerCase() === query ||
          (c.email && c.email.toLowerCase() === query) ||
          (cleanQuery.length >= 7 && c.contactNumber && c.contactNumber.replace(/[^0-9]/g, '') === cleanQuery) ||
          c.name.toLowerCase() === query
      );

      if (!customer) {
        return {
          success: false,
          message: 'No registered customer account matches that username, email, or mobile number. Please sign up or verify spelling.',
        };
      }

      // Check if user already exists for this customer ID
      custUser = users.find((u) => u.customerId === customer.id || u.id === `usr-${customer.id}` || u.id === `cust-${customer.id}`);

      if (!custUser) {
        custUser = {
          id: `usr-${customer.id}`,
          customerId: customer.id,
          name: customer.name,
          username: customer.email ? customer.email.split('@')[0] : `cust_${customer.id}`,
          password: 'password123',
          role: 'customer',
          email: customer.email || '',
          phone: customer.contactNumber,
          status: 'active',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80',
          lastLogin: new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' }),
        };
        setUsers((prev) => [...prev, custUser]);
      }
    }

    if (custUser.status === 'inactive') {
      return { success: false, message: 'This customer account is currently inactive. Please contact station staff.' };
    }

    const expectedPassword = custUser.password || 'password123';
    if (password !== expectedPassword) {
      return {
        success: false,
        message: 'Incorrect password for this customer account. Password verification is required to prevent unauthorized refill orders.',
      };

    setIsAuthenticated(true);
    localStorage.setItem('aquaflow_is_authenticated', 'true');
    localStorage.setItem(STORAGE_KEYS.CURRENT_USER_ID, custUser.id);
    logActivity('Customer Signed In', `${custUser.name} authenticated into customer portal`, 'customer');
    return { success: true };
  };

  const registerUser = (userData) => {
    const trimmedUser = userData.username.trim().toLowerCase();
    const existing = users.find((u) => u.username.toLowerCase() === trimmedUser);

    if (existing) {
      return { success: false, message: 'Username is already taken. Please choose another username.' };
    }

    const newUserId = `usr-${Date.now()}`;
    let newCustomerId = null;

    if (userData.role === 'customer') {
      const newCust = {
        id: `cust-${Date.now()}`,
        name: userData.name,
        contactNumber: userData.phone || '0912-345-6789',
        email: userData.email || '',
        customerType: userData.customerType || 'Residential',

        deliveryNotes: userData.deliveryNotes || '',
        containersHeld: parseInt(userData.containersHeld || 0, 10),

        totalSpent: 0,
        registeredDate: new Date().toISOString().split('T')[0],
        status: 'active',
        coordinates: userData.coordinates || {
          lat: settings.coordinates.lat + (Math.random() - 0.5) * 0.008,
          lng: settings.coordinates.lng + (Math.random() - 0.5) * 0.008,
        },
      };

      setCustomers((prev) => [newCust, ...prev]);
      logActivity('Customer Profile Created', `Registered new client profile for ${newCust.name} (${newCust.barangay})`, 'customer');
    }

    const newUser = {
      ...userData,
      id: newUserId,
      customerId: newCustomerId,
      status: 'active',
      password: userData.password || 'password123',
      lastLogin: new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' }),
    };

    setCurrentUserId(newUser.id);
    setIsAuthenticated(true);
    localStorage.setItem('aquaflow_is_authenticated', 'true');
    localStorage.setItem(STORAGE_KEYS.CURRENT_USER_ID, newUser.id);
    logActivity('User Registered', `${newUser.name} created account with role ${newUser.role.toUpperCase()}`, 'staff');
    return { success: true };

  const logout = () => {

  const updateUser = (id, updates) => {

  const deleteUser = (id) => {
    const target = users.find((u) => u.id === id);

  const updateCustomer = (id, updates) => {

  const recordVendingCollection = (recordData) => {
    const newRecord = {
      ...recordData,
      id: `vs-${Date.now()}`,
    };
    setVendingSales((prev) => [newRecord, ...prev]);

    setVendingMachines((prev) =>
      prev.map((vm) => {
        if (vm.id === recordData.machineId) {
          const newLifetime = vm.totalLifetimeSales + recordData.coinsCollected;
          let newWaterLevel = vm.currentWaterLevelLiters - recordData.waterDispensedLiters;
          if (recordData.waterRefilledLiters) {
            newWaterLevel = Math.min(vm.waterCapacityLiters, newWaterLevel + recordData.waterRefilledLiters);
          }
          const newStatus = newWaterLevel < 200 ? 'low_water' : 'operational';
          return {
            ...vm,
            currentCoinTotal: 0,
            totalLifetimeSales: newLifetime,
            currentWaterLevelLiters: Math.max(0, newWaterLevel),
            status: newStatus,
            lastCollectionDate: recordData.date,
          };
        }
        return vm;
      })
    );

    const now = new Date();
    const consTx = {
      id: `tx-vnd-${Date.now()}`,
      transactionNumber: `TX-VND-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}-${Math.floor(100 + Math.random() * 900)}`,

      notes: recordData.notes || `Daily vending collection for ${recordData.machineName}`,
    };
    setSales((prev) => [consTx, ...prev]);

    logActivity(
      'Vending Machine Collection',

    const newOrder = {
      ...orderData,
      id: `ord-${Date.now()}`,
      orderNumber,
      date: now.toISOString().split('T')[0],
      time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),

    setOrders((prev) => [newOrder, ...prev]);

    if (orderData.customerId) {
      setCustomers((prev) =>
        prev.map((c) =>
          c.id === orderData.customerId

                totalOrders: c.totalOrders + 1,

          }
          if (status === 'Delivered') {
            updates.deliveredAt = new Date().toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
            updates.paymentStatus = 'paid';

          return { ...ord, ...updates };
        }
        return ord;

    );

    const order = orders.find((o) => o.id === id);

// Pure local Haversine distance calculation in kilometers (Zero APIs)
function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
  const R = 6371; // Earth's mean radius in km
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos((lat1 * Math.PI) / 180) *
      Math.cos((lat2 * Math.PI) / 180) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return parseFloat((R * c).toFixed(2));
}

// Local travel time estimation in minutes (Zero APIs)
function estimateDriveMinutes(distanceKm) {
  if (!distanceKm || distanceKm <= 0) return 3;
  return Math.max(3, Math.round(distanceKm * 2.8 + 2));
}

    driverLocation,
  ]);

  // Center to selected order with smooth flyTo animation
  useEffect(() => {
    if (selectedOrderId && mapInstanceRef.current) {
      const order = orders.find((o) => o.id === selectedOrderId);
      if (order) {
        mapInstanceRef.current.flyTo([order.coordinates.lat, order.coordinates.lng], 16, {
          duration: 1.2,
        });
      }
    }
  }, [selectedOrderId, orders]);

  // Map controls
  const resetToStation = () => {
    if (mapInstanceRef.current) {
      mapInstanceRef.current.flyTo([stationLat, stationLng], initialZoom, {
        duration: 1,
      });
    }
  };

  const fitAllStops = () => {
    const map = mapInstanceRef.current;
    if (!map) return;

    const coords = [[stationLat, stationLng]];
    orders.forEach((o) => {
      coords.push([o.coordinates.lat, o.coordinates.lng]);
    });
    if (driverLocation) {
      coords.push([driverLocation.lat, driverLocation.lng]);
    }

    if (coords.length > 1) {
      const bounds = L.latLngBounds(coords);
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
    }
  };

  // Browser HTML5 Geolocation (Standard Web API built into browser, 0 external APIs)
  const handleLocateMe = () => {
    setIsLocating(true);
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          setDriverLocation(loc);
          setIsLocating(false);
          if (mapInstanceRef.current) {
            mapInstanceRef.current.flyTo([loc.lat, loc.lng], 16, { duration: 1 });
          }
        },
        () => {
          // Simulation near station if browser permission is blocked
          const simLat = stationLat + 0.0025;
          const simLng = stationLng + 0.0035;
          setDriverLocation({ lat: simLat, lng: simLng });
          setIsLocating(false);
          if (mapInstanceRef.current) {
            mapInstanceRef.current.flyTo([simLat, simLng], 16, { duration: 1 });
          }
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    } else {
      setIsLocating(false);
    }
  };

  // Calculate solid pixel height to prevent zero-height collapse
  const resolvedHeight = useMemo(() => {
    if (typeof heightClass === 'string') {
      const match = heightClass.match(/h-\[(\d+)px\]/);
      if (match && match[1]) {
        return parseInt(match[1], 10);
      }
    }
    return 480;
  }, [heightClass]);

  useEffect(() => {
    if (mapInstanceRef.current) {
      setTimeout(() => {
        mapInstanceRef.current?.invalidateSize();
      }, 60);
    }
  }, [activeTab, resolvedHeight]);

  return (
    <div className="rounded-2xl overflow-hidden border border-slate-200/90 shadow-xs bg-white flex flex-col relative">
      {/* Top Map Controls Toolbar */}
      <div className="bg-slate-50/90 border-b border-slate-200 px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2.5 text-xs">
        {/* Layer & Filter Buttons */}
        <div className="flex items-center gap-1 bg-white p-1 rounded-xl border border-slate-200 shadow-2xs">
          <button
            type="button"
            onClick={() => setActiveTab('all')}
            className={`px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer ${
              activeTab === 'all'
                ? 'bg-cyan-600 text-white shadow-2xs font-bold'
                : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
            }`}
          >
            All Points
          </button>
          <button
            type="button"
            onClick={() => setActiveTab('active_deliveries')}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer ${
              activeTab === 'active_deliveries'
                ? 'bg-indigo-600 text-white shadow-2xs font-bold'
                : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
            }`}
          >
            <Truck className="w-3.5 h-3.5" />
            <span>Active Trips</span>
          </button>
          {showVendingMachines && (
            <button
              type="button"
              onClick={() => setActiveTab('vending')}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer ${
                activeTab === 'vending'
                  ? 'bg-purple-600 text-white shadow-2xs font-bold'
                  : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
              }`}
            >
              <Store className="w-3.5 h-3.5" />
              <span>Vending ({vendingMachines.length})</span>
            </button>
          )}
          {showAllCustomers && (
            <button
              type="button"
              onClick={() => setActiveTab('coverage')}
              className={`px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer ${
                activeTab === 'coverage'
                  ? 'bg-slate-800 text-white shadow-2xs font-bold'
                  : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
              }`}
            >
              Customer Base
            </button>
          )}
        </div>

        {/* Action Controls: Fit Route, Locate Me, Re-center */}
        <div className="flex items-center gap-1.5">
          {orders.length > 0 && (
            <button
              type="button"
              onClick={fitAllStops}
              className="px-2.5 py-1.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl border border-slate-200 font-bold text-xs flex items-center gap-1 shadow-2xs transition-colors cursor-pointer"
              title="Fit all delivery destinations in view"
            >
              <Route className="w-3.5 h-3.5 text-indigo-600" />
              <span>Fit Route</span>
            </button>
          )}

          <button
            type="button"
            onClick={handleLocateMe}
            className={`px-2.5 py-1.5 bg-white hover:bg-slate-100 rounded-xl border border-slate-200 font-bold text-xs flex items-center gap-1 shadow-2xs transition-colors cursor-pointer ${
              driverLocation ? 'text-emerald-700 font-bold' : 'text-slate-700'
            }`}
            title="Locate Driver Vehicle (HTML5 Browser GPS)"
          >
            <LocateFixed className={`w-3.5 h-3.5 ${driverLocation ? 'text-emerald-600' : 'text-slate-600'}`} />
            <span>{isLocating ? 'Locating...' : driverLocation ? 'GPS Active' : 'Locate Me'}</span>
          </button>

          <button
            type="button"
            onClick={resetToStation}
            className="px-2.5 py-1.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl border border-slate-200 font-bold text-xs flex items-center gap-1 shadow-2xs transition-colors cursor-pointer"
            title="Recenter Map to Station HQ"
          >
            <Compass className="w-3.5 h-3.5 text-cyan-600" />
            <span>Station Base</span>
          </button>
        </div>
      </div>

      {/* Interactive Map Surface */}
      <div
        ref={mapContainerRef}
        style={{ height: `${resolvedHeight}px`, minHeight: `${resolvedHeight}px` }}
        className="w-full relative z-10"
      />

      {/* Floating In-App Destination Card (Zero APIs, Pure React Component) */}
      {selectedOrder && (
        <div className="absolute bottom-11 left-3 right-3 sm:left-4 sm:right-auto sm:max-w-sm bg-white/95 backdrop-blur-md p-3.5 rounded-2xl border border-indigo-200 shadow-xl z-20 animate-in fade-in slide-in-from-bottom-2 duration-150">

                {selectedMetrics && (

// === Module: src/components/POS/POSModal.jsx ===
const POSModal = ({ isOpen, onClose }) => {
  const {
    products,
    customers,
    recordSale,
    currentUser,
    settings,
    setPrintableItem,
    deleteProduct,
    addProduct,
    requestConfirm,
  } = useApp();

  const [cart, setCart] = useState([]);
  const [selectedCustomerId, setSelectedCustomerId] = useState('');
  const [guestName, setGuestName] = useState('Walk-in Customer');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [searchTerm, setSearchTerm] = useState('');
  const [discountAmount, setDiscountAmount] = useState(0);
  const [deliveryFee, setDeliveryFee] = useState(0);
  const [containerDepositAmount, setContainerDepositAmount] = useState(0);
  const [paymentMethod, setPaymentMethod] = useState('cash');
  const [amountTendered, setAmountTendered] = useState('');
  const [notes, setNotes] = useState('');
  const [orderType, setOrderType] = useState('walkin');

  // Admin add product modal state in POS
  const [isAddProductOpen, setIsAddProductOpen] = useState(false);
  const [newProdName, setNewProdName] = useState('');
  const [newProdCode, setNewProdCode] = useState('');
  const [newProdCategory, setNewProdCategory] = useState('refill');
  const [newProdPrice, setNewProdPrice] = useState(30);
  const [newProdStock, setNewProdStock] = useState(100);
  const [newProdUnit, setNewProdUnit] = useState('jug');

  if (!isOpen) return null;

  const selectedCustomer = customers.find((c) => c.id === selectedCustomerId);

  // Filter products
  const filteredProducts = products.filter((p) => {
    const matchesCategory = categoryFilter === 'all' || p.category === categoryFilter;
    const matchesSearch =
      p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
      p.code.toLowerCase().includes(searchTerm.toLowerCase());
    return matchesCategory && matchesSearch;
  });

  const addToCart = (product) => {
    setCart((prev) => {
      const existing = prev.find((item) => item.productId === product.id);
      if (existing) {
        return prev.map((item) =>
          item.productId === product.id
            ? { ...item, quantity: item.quantity + 1, total: (item.quantity + 1) * item.unitPrice }
            : item
        );
      }
      return [
        ...prev,
        {
          productId: product.id,
          productName: product.name,
          quantity: 1,
          unitPrice: product.price,
          unit: product.unit,
          isWater: product.isWater,
          requiresContainerSwap: product.requiresContainerSwap,
          total: product.price,
        },
      ];
    });
  };

  const updateQuantity = (productId, delta) => {
    setCart((prev) =>
      prev
        .map((item) => {
          if (item.productId === productId) {
            const newQty = item.quantity + delta;
            return newQty > 0
              ? { ...item, quantity: newQty, total: newQty * item.unitPrice }
              : null;
          }
          return item;
        })
        .filter(Boolean)
    );
  };

  const removeFromCart = (productId) => {
    setCart((prev) => prev.filter((item) => item.productId !== productId));
  };

  const clearCart = () => {
    setCart([]);
    setDiscountAmount(0);
    setDeliveryFee(0);
    setContainerDepositAmount(0);
    setAmountTendered('');
    setNotes('');
  };

  // Admin delete product from station listing
  const handleDeleteCatalogProduct = (product) => {
    requestConfirm(`Are you sure you want to remove "${product.name}" (${product.code}) from the station listing?`, () => {
      if (deleteProduct) deleteProduct(product.id);
      removeFromCart(product.id);
    });
  };

  // Admin add product to station listing
  const handleAddProductSubmit = (e) => {
    e.preventDefault();
    if (!newProdName.trim()) return;
    const code = newProdCode.trim() || `ITM-${Date.now().toString().slice(-4)}`;
    if (addProduct) {
      addProduct({
        code,
        name: newProdName.trim(),
        category: newProdCategory,
        price: parseFloat(newProdPrice) || 0,
        cost: Math.round((parseFloat(newProdPrice) || 0) * 0.3),
        stock: parseInt(newProdStock, 10) || 50,
        minStock: 20,
        unit: newProdUnit,
        isWater: newProdCategory === 'refill',
        requiresContainerSwap: newProdCategory === 'refill',
        description: 'Station catalog item added from POS counter.',
      });
    }
    setIsAddProductOpen(false);
    setNewProdName('');
    setNewProdCode('');
    setNewProdPrice(30);
    setNewProdStock(100);
  };

  // Calculations
  const subtotal = cart.reduce((acc, item) => acc + item.total, 0);
  const totalAmount = Math.max(0, subtotal - discountAmount + deliveryFee + containerDepositAmount);
  const tenderedNum = parseFloat(amountTendered) || 0;
  const change = Math.max(0, tenderedNum - totalAmount);

  const handleCheckout = (autoPrint = true) => {
    if (cart.length === 0) return;

    const customerName = selectedCustomer ? selectedCustomer.name : guestName.trim() || 'Walk-in Customer';

    const recorded = recordSale({
      customerId: selectedCustomer?.id,
      customerName,
      customerType: selectedCustomer?.customerType || 'Residential',
      orderType,
      items: cart,
      subtotal,
      discount: discountAmount,
      deliveryFee,
      containerDeposit: containerDepositAmount,
      totalAmount,
      amountPaid: paymentMethod === 'cash' ? Math.max(tenderedNum, totalAmount) : totalAmount,
      change: paymentMethod === 'cash' ? change : 0,
      paymentMethod,
      paymentStatus: 'paid',
      staffName: currentUser.name,
      notes,
    });

    if (autoPrint) {
      setPrintableItem({ type: 'receipt', data: recorded });
    }

    clearCart();
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-950/70 backdrop-blur-sm">
      <div className="relative w-full max-w-6xl h-[92vh] bg-slate-100 rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-slate-200">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 bg-white border-b border-slate-200">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-cyan-600 text-white flex items-center justify-center shadow-md">
              <ShoppingCart className="w-5 h-5" />
            </div>
            <div>
              <h2 className="font-bold text-slate-900 text-base">Point of Sale (POS) Counter</h2>
              <p className="text-xs text-slate-500">
                Staff: <span className="font-semibold text-slate-700">{currentUser.name}</span> • Quick Register & Cash Slip
              </p>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <button
              type="button"
              onClick={onClose}
              className="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100 transition-colors"
            >
              <X className="w-6 h-6" />
            </button>
          </div>
        </div>

        {/* POS Body: 2 Columns */}
        <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
          {/* Left 7 Cols Catalog */}
          <div className="lg:col-span-7 p-5 flex flex-col overflow-hidden border-r border-slate-200 bg-slate-50/50">
            {/* Search, Categories & Admin Controls */}
            <div className="space-y-3 mb-4">

                    <input
                      type="number"
                      min="0"
                      step="0.5"

                      value={newProdPrice}
                      onChange={(e) => setNewProdPrice(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:border-cyan-500 focus:bg-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Initial Stock</label>
                    <input
                      type="number"
                      min="0"
                      required
                      value={newProdStock}
                      onChange={(e) => setNewProdStock(e.target.value)}

                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Unit</label>

                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setIsAddProductOpen(false)}
                    className="px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"

                    Cancel

                  <button
                    type="submit"
                    className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl shadow-sm transition-colors cursor-pointer"

                    Add to Catalog
                  </button>
                </div>
              </form>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const RegisterPage = ({
  onNavigateToLogin,
  onNavigateToLanding,
  onSuccess,
}) => {
  const { registerUser } = useApp();

  const [name, setName] = useState('');
  const [username, setUsername] = useState('');
  const [role, setRole] = useState('customer');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('09');
  const [address, setAddress] = useState('');
  const [barangay, setBarangay] = useState('Brgy. Enclaro');
  const [customerType, setCustomerType] = useState('Residential');
  const [containersHeld, setContainersHeld] = useState('0');
  const [deliveryNotes, setDeliveryNotes] = useState('');
  const [password, setPassword] = useState('password123');
  const [confirmPassword, setConfirmPassword] = useState('password123');
  const [showPassword, setShowPassword] = useState(false);
  const [showConfirmPassword, setShowConfirmPassword] = useState(false);
  const [agreedTerms, setAgreedTerms] = useState(true);

  const [errorMessage, setErrorMessage] = useState('');
  const [isLoading, setIsLoading] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    setErrorMessage('');

    if (!name.trim() || !username.trim()) {
      setErrorMessage('Please provide both your full name and preferred username.');
      return;
    }

    if (role === 'customer' && !address.trim()) {
      setErrorMessage('Please enter your delivery street address or house/purok number for water refilling delivery.');
      return;
    }

    // Phone validation
    const cleanPhone = phone.replace(/[^0-9]/g, '');
    if (cleanPhone.length < 10) {
      setErrorMessage('Please provide a valid 11-digit mobile number (e.g. 0917-123-4567).');
      return;
    }

    if (password !== confirmPassword) {
      setErrorMessage('Passwords do not match. Please verify.');
      return;
    }

    if (password.length < 4) {
      setErrorMessage('Password must be at least 4 characters long.');
      return;
    }

    if (!agreedTerms) {
      setErrorMessage('Please agree to station operational guidelines to proceed.');
      return;
    }

    setIsLoading(true);

    setTimeout(() => {
      const res = registerUser({
        name: name.trim(),
        username: username.trim(),
        role,
        email: email.trim() || `${username.toLowerCase()}@aquafabz-station.com`,
        phone: phone.trim(),
        address: address.trim() || `${barangay}, Binalbagan`,
        barangay: barangay,
        customerType: customerType,
        containersHeld: parseInt(containersHeld, 10) || 0,
        deliveryNotes: deliveryNotes.trim(),
        password,
        status: 'active',
        avatar: `https://images.unsplash.com/photo-${1530000000000 + Math.floor(Math.random() * 9999999)}?w=150&auto=format&fit=crop&q=80`,
      });

      setIsLoading(false);

      if (!res.success) {
        setErrorMessage(res.message || 'Registration failed.');
      } else {
        if (onSuccess) onSuccess();
      }
    }, 200);
  };

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between relative overflow-hidden">
      {/* Ambient background lighting */}
      <div className="absolute inset-0 pointer-events-none">

            <div>

const Dashboard = ({
  onNavigate,
  onOpenPOS,
  onOpenNewOrder,
  onOpenVendingRecord,
}) => {
  const { currentUser } = useApp();

  if (currentUser.role === 'customer') {
    return <CustomerPortalView />;
  }

  if (currentUser.role === 'delivery') {
    return <DriverDashboard onNavigate={onNavigate} />;
  }

  if (currentUser.role === 'staff') {
    return (
      <StaffDashboard
        onNavigate={onNavigate}
        onOpenPOS={onOpenPOS}
        onOpenNewOrder={onOpenNewOrder}
        onOpenVendingRecord={onOpenVendingRecord}
      />
    );
  }

  // Default to Owner / Admin Exclusive Dashboard Landing
  return (
    <AdminDashboard
      onNavigate={onNavigate}
      onOpenPOS={onOpenPOS}
      onOpenNewOrder={onOpenNewOrder}
      onOpenVendingRecord={onOpenVendingRecord}
    />
  );
};

const ContainerView = () => {
  const {
    containers,
    recordContainerAction,
    customers,
    currentUser,
    settings,
    setPrintableItem,
  } = useApp();

  const [isModalOpen, setIsModalOpen] = useState(false);
  const [modalType, setModalType] = useState('borrow');
  const [selectedCustomerId, setSelectedCustomerId] = useState(customers[0]?.id || '');
  const [guestName, setGuestName] = useState('');
  const [containerType, setContainerType] = useState('5-Gallon Slim');
  const [quantity, setQuantity] = useState(2);
  const [depositPerJug, setDepositPerJug] = useState(settings.defaultContainerDeposit);
  const [notes, setNotes] = useState('');
  const [searchTerm, setSearchTerm] = useState('');

  // Calculate container metrics
  const totalBorrowed = customers.reduce((sum, c) => sum + (c.containersHeld || 0), 0);
  const availableAtStation = 185; // Current active washed & ready stock in station bay
  const damagedContainers = containers.filter((c) => c.actionType === 'damaged').reduce((sum, c) => sum + c.quantity, 0);
  const returnedRecordsCount = containers.filter((c) => c.actionType === 'return').reduce((sum, c) => sum + c.quantity, 0);

  // Filtered customer container ledger
  const customersWithContainers = customers.filter(
    (c) =>
      c.containersHeld > 0 &&
      (c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        c.barangay.toLowerCase().includes(searchTerm.toLowerCase()))
  );

  const handleSubmit = (e) => {
    e.preventDefault();
    const customer = customers.find((c) => c.id === selectedCustomerId);
    const customerName = customer ? customer.name : guestName || 'Walk-in Customer';

    const depositAmount = modalType === 'borrow' ? quantity * depositPerJug : 0;
    const refundAmount = modalType === 'return' ? quantity * depositPerJug : 0;

    recordContainerAction({
      customerId: customer?.id,
      customerName,
      containerType,
      actionType: modalType,
      quantity,
      depositAmount,
      refundAmount,
      status: modalType === 'return' ? 'cleared' : modalType === 'damaged' ? 'scrapped' : 'active',
      notes,
      staffName: currentUser.name,
    });

    setIsModalOpen(false);
    setNotes('');
    setQuantity(2);
  };

  const openActionModal = (type, customerId) => {
    setModalType(type);
    if (customerId) setSelectedCustomerId(customerId);
    setIsModalOpen(true);
  };

  return (
    <div className="space-y-6">
      {/* Banner */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
        <div>
          <div className="flex items-center gap-2 text-cyan-600 text-xs font-bold uppercase tracking-wider mb-1">
            <Droplets className="w-4 h-4" />
            <span>Container Assets & Deposit Control</span>
          </div>
          <h2 className="text-xl font-black text-slate-900">
            Water Container Circulation & Inventory Tracking
          </h2>
          <p className="text-xs text-slate-500 mt-0.5">
            Monitor available station jugs, borrowed containers in customer custody, deposit records, and damaged bottle write-offs.
          </p>
        </div>

        <div className="flex flex-wrap items-center gap-2">
          <button
            type="button"
            onClick={() => openActionModal('borrow')}
            className="flex items-center gap-1.5 px-3.5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all"
          >
            <Plus className="w-4 h-4" />
            <span>Borrow Container</span>
          </button>
          <button
            type="button"
            onClick={() => openActionModal('return')}
            className="flex items-center gap-1.5 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all"
          >
            <RotateCcw className="w-4 h-4" />
            <span>Return & Refund</span>
          </button>
          <button
            type="button"
            onClick={() => openActionModal('damaged')}
            className="flex items-center gap-1.5 px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl text-xs font-semibold transition-colors"
          >
            <AlertTriangle className="w-4 h-4" />
            <span>Record Damaged</span>
          </button>
        </div>
      </div>

      {/* KPI Cards */}
      <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <span className="text-xs font-medium text-slate-500 uppercase tracking-wider block">
            Available at Station
          </span>
          <span className="text-2xl font-black text-cyan-700 mt-1 block">
            {availableAtStation}
          </span>
          <span className="text-[11px] text-slate-400">Sanitized & ready for refilling</span>
        </div>

        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <span className="text-xs font-medium text-slate-500 uppercase tracking-wider block">

          </span>
          <span className="text-2xl font-black text-indigo-600 mt-1 block">

          </span>

};

const InventoryView = () => {
  const {
    products,
    addProduct,
    updateProduct,
    deleteProduct,
    stockMovements,
    recordStockMovement,
    currentUser,
  } = useApp();

  const [searchTerm, setSearchTerm] = useState('');
  const [selectedCategory, setSelectedCategory] = useState('all');
  const [isStockInModalOpen, setIsStockInModalOpen] = useState(false);
  const [isStockOutModalOpen, setIsStockOutModalOpen] = useState(false);
  const [isProductModalOpen, setIsProductModalOpen] = useState(false);
  const [editingProduct, setEditingProduct] = useState(null);

  // Form states for stock movement
  const [selectedProductId, setSelectedProductId] = useState(products[0]?.id || '');
  const [movementQty, setMovementQty] = useState(10);
  const [refNumber, setRefNumber] = useState('');
  const [supplierOrParty, setSupplierOrParty] = useState('');
  const [reason, setReason] = useState('');
  const [outType, setOutType] = useState('stock_out');

  // Form states for product
  const [prodCode, setProdCode] = useState('');
  const [prodName, setProdName] = useState('');
  const [prodCategory, setProdCategory] = useState('refill');
  const [prodPrice, setProdPrice] = useState(30);
  const [prodCost, setProdCost] = useState(5);
  const [prodStock, setProdStock] = useState(100);
  const [prodMinStock, setProdMinStock] = useState(20);
  const [prodUnit, setProdUnit] = useState('jug');
  const [prodDesc, setProdDesc] = useState('');

  // Filter products
  const filteredProducts = products.filter((p) => {
    const matchesSearch =
      p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
      p.code.toLowerCase().includes(searchTerm.toLowerCase());
    const matchesCat = selectedCategory === 'all' || p.category === selectedCategory;
    return matchesSearch && matchesCat;
  });

  const lowStockCount = products.filter((p) => p.stock <= p.minStock).length;

  const handleStockInSubmit = (e) => {
    e.preventDefault();
    const product = products.find((p) => p.id === selectedProductId);
    if (!product) return;

    const previousStock = product.stock;
    const newStock = previousStock + movementQty;

    recordStockMovement({
      productId: product.id,
      productName: product.name,
      movementType: 'stock_in',
      quantity: movementQty,
      previousStock,
      newStock,
      referenceNo: refNumber || `PO-${Date.now().toString().slice(-6)}`,
      supplierOrParty: supplierOrParty || 'Local Water Packaging Supply',
      staffName: currentUser.name,
      notes: reason || 'Inventory replenishment received',
    });

    setIsStockInModalOpen(false);
    setMovementQty(10);
    setRefNumber('');
    setSupplierOrParty('');
    setReason('');
  };

  const handleStockOutSubmit = (e) => {
    e.preventDefault();
    const product = products.find((p) => p.id === selectedProductId);
    if (!product) return;

    const previousStock = product.stock;
    const newStock = Math.max(0, previousStock - movementQty);

    recordStockMovement({
      productId: product.id,
      productName: product.name,
      movementType: outType,
      quantity: movementQty,
      previousStock,
      newStock,
      referenceNo: refNumber || `STK-OUT-${Date.now().toString().slice(-6)}`,
      supplierOrParty: supplierOrParty || 'Internal Station Bay',
      staffName: currentUser.name,
      notes: reason || 'Stock consumed, damaged or adjusted',
    });

    setIsStockOutModalOpen(false);
    setMovementQty(10);
    setReason('');
  };

  const openEditProduct = (prod) => {
    setEditingProduct(prod);
    setProdCode(prod.code);
    setProdName(prod.name);
    setProdCategory(prod.category);
    setProdPrice(prod.price);
    setProdCost(prod.cost);
    setProdStock(prod.stock);
    setProdMinStock(prod.minStock);
    setProdUnit(prod.unit);
    setProdDesc(prod.description);
    setIsProductModalOpen(true);
  };

  const openNewProduct = () => {
    setEditingProduct(null);
    setProdCode(`ITM-${Math.floor(100 + Math.random() * 900)}`);
    setProdName('');
    setProdCategory('supplies');
    setProdPrice(50);
    setProdCost(30);
    setProdStock(50);
    setProdMinStock(15);
    setProdUnit('pc');
    setProdDesc('');
    setIsProductModalOpen(true);
  };

  const handleSaveProduct = (e) => {
    e.preventDefault();
    if (editingProduct) {
      updateProduct(editingProduct.id, {
        code: prodCode,
        name: prodName,
        category: prodCategory,
        price: prodPrice,
        cost: prodCost,
        stock: prodStock,
        minStock: prodMinStock,
        unit: prodUnit,
        description: prodDesc,
      });
    } else {
      addProduct({
        code: prodCode,
        name: prodName,
        category: prodCategory,
        price: prodPrice,
        cost: prodCost,
        stock: prodStock,
        minStock: prodMinStock,
        unit: prodUnit,
        isWater: prodCategory === 'refill' || prodCategory === 'bottle',
        description: prodDesc,
      });
    }
    setIsProductModalOpen(false);
  };

  return (
    <div className="space-y-6">
      {/* Top Banner */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
        <div>
          <div className="flex items-center gap-2 text-cyan-600 text-xs font-bold uppercase tracking-wider mb-1">
            <Package className="w-4 h-4" />
            <span>Inventory, Pricing & Supplies Control</span>
          </div>
          <h2 className="text-xl font-black text-slate-900">
            Water Station Inventory & Stock-In / Stock-Out
          </h2>
          <p className="text-xs text-slate-500 mt-0.5">
            Manage water refills, empty containers, dispenser pumps, non-spill caps, and tamper-evident heat seals.
          </p>
        </div>

        <div className="flex flex-wrap items-center gap-2">
          {currentUser.role === 'admin' && (
            <button
              type="button"
              onClick={openNewProduct}
              className="flex items-center gap-1.5 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition-colors"
            >
              <Plus className="w-4 h-4" />
              <span>Add Product</span>
            </button>
          )}

          <button
            type="button"
            onClick={() => setIsStockInModalOpen(true)}
            className="flex items-center gap-1.5 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all"
          >
            <ArrowDownLeft className="w-4 h-4" />
            <span>Stock-In</span>
          </button>

          <button
            type="button"
            onClick={() => setIsStockOutModalOpen(true)}
            className="flex items-center gap-1.5 px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all"
          >
            <ArrowUpRight className="w-4 h-4" />
            <span>Stock-Out</span>
          </button>
        </div>
      </div>

      {/* Low-stock indicator if any */}
      {lowStockCount > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-center justify-between text-xs text-amber-900">
          <div className="flex items-center gap-2.5">
            <AlertTriangle className="w-5 h-5 text-amber-600 shrink-0" />

            </span>

      {/* Products Inventory Table */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

const CustomerView = () => {
  const {
    customers,
    addCustomer,
    updateCustomer,
    deleteCustomer,
    sales,
    orders,
    containers,
    settings,
    setPrintableItem,
    requestConfirm,
  } = useApp();

  const [searchTerm, setSearchTerm] = useState('');
  const [selectedType, setSelectedType] = useState('all');
  const [selectedCustomer, setSelectedCustomer] = useState(customers[0] || null);
  const [isAddEditModalOpen, setIsAddEditModalOpen] = useState(false);
  const [isEditing, setIsEditing] = useState(false);

  // Form states
  const [custName, setCustName] = useState('');
  const [custPhone, setCustPhone] = useState('');
  const [custEmail, setCustEmail] = useState('');
  const [custType, setCustType] = useState('Residential');
  const [custAddress, setCustAddress] = useState('');
  const [custBarangay, setCustBarangay] = useState('Brgy. Enclaro');
  const [custContainers, setCustContainers] = useState('0');
  const [custLat, setCustLat] = useState(settings.coordinates.lat);
  const [custLng, setCustLng] = useState(settings.coordinates.lng);
  const [custNotes, setCustNotes] = useState('');

  // Filter customers
  const filteredCustomers = customers.filter((c) => {
    const matchesSearch =
      c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
      c.contactNumber.includes(searchTerm) ||
      c.primaryAddress.toLowerCase().includes(searchTerm.toLowerCase()) ||
      c.barangay.toLowerCase().includes(searchTerm.toLowerCase());
    const matchesType = selectedType === 'all' || c.customerType === selectedType;
    return matchesSearch && matchesType;
  });

  const openAddModal = () => {
    setIsEditing(false);
    setCustName('');
    setCustPhone('09');
    setCustEmail('');
    setCustType('Residential');
    setCustAddress('');
    setCustBarangay('Brgy. Enclaro');
    setCustContainers('0');
    // slight offset from station HQ
    setCustLat(settings.coordinates.lat + (Math.random() - 0.5) * 0.01);
    setCustLng(settings.coordinates.lng + (Math.random() - 0.5) * 0.01);
    setCustNotes('');
    setIsAddEditModalOpen(true);
  };

  const openEditModal = (cust) => {
    setIsEditing(true);
    setCustName(cust.name);
    setCustPhone(cust.contactNumber);
    setCustEmail(cust.email || '');
    setCustType(cust.customerType);
    setCustAddress(cust.primaryAddress);
    setCustBarangay(cust.barangay);
    setCustLat(cust.coordinates.lat);
    setCustLng(cust.coordinates.lng);
    setCustNotes(cust.deliveryNotes || '');
    setIsAddEditModalOpen(true);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!custName || !custAddress) return;

    if (isEditing && selectedCustomer) {
      updateCustomer(selectedCustomer.id, {
        name: custName,
        contactNumber: custPhone,
        email: custEmail,
        customerType: custType,
        primaryAddress: custAddress,
        barangay: custBarangay,
        coordinates: {
          lat: custLat,
          lng: custLng,
        },
        deliveryNotes: custNotes,
      });
      setSelectedCustomer((prev) =>
        prev
          ? {
              ...prev,
              name: custName,
              contactNumber: custPhone,
              email: custEmail,
              customerType: custType,
              primaryAddress: custAddress,
              barangay: custBarangay,
              coordinates: { lat: custLat, lng: custLng },
              deliveryNotes: custNotes,
            }
          : null
      );
    } else {
      const created = addCustomer({
        name: custName,
        contactNumber: custPhone,
        email: custEmail,
        customerType: custType,
        primaryAddress: custAddress,
        barangay: custBarangay,
        coordinates: {
          lat: custLat,
          lng: custLng,
        },
        deliveryNotes: custNotes,
        containersHeld: parseInt(custContainers, 10) || 0,
        status: 'active',
      });
      setSelectedCustomer(created);
    }

    setIsAddEditModalOpen(false);

  // Find customer-specific histories
  const customerOrders = orders.filter((o) => o.customerId === selectedCustomer?.id);

            <Users className="w-4 h-4" />
            <span>Customer CRM & Geolocation Profiles</span>
          </div>
          <h2 className="text-xl font-black text-slate-900">

      {/* Main Grid Customer Directory & Right Full Profile View */}

// === Module: src/components/Sales/SalesView.jsx ===
const SalesView = ({ onOpenPOS }) => {
  const { sales, setPrintableItem, settings } = useApp();

  const [searchTerm, setSearchTerm] = useState('');
  const [filterType, setFilterType] = useState('all');
  const [dateFilter, setDateFilter] = useState('');

  const filteredSales = sales.filter((s) => {
    const matchesSearch =
      s.transactionNumber.toLowerCase().includes(searchTerm.toLowerCase()) ||
      s.customerName.toLowerCase().includes(searchTerm.toLowerCase()) ||
      s.staffName.toLowerCase().includes(searchTerm.toLowerCase());

    const matchesType =
      filterType === 'all'
        ? true
        : filterType === 'vending'
        ? s.isVendingMachineConsolidated
        : !s.isVendingMachineConsolidated;

    const matchesDate = !dateFilter || s.date === dateFilter;

    return matchesSearch && matchesType && matchesDate;
  });

  const totalFilteredSales = filteredSales.reduce((sum, s) => sum + s.totalAmount, 0);

  // Export to CSV
  const handleExportCSV = () => {
    const headers = ['Transaction Number', 'Date', 'Time', 'Customer', 'Type', 'Total Amount', 'Payment Method', 'Staff'];
    const rows = filteredSales.map((s) => [
      s.transactionNumber,
      s.date,
      s.time,
      `"${s.customerName}"`,
      s.orderType,
      s.totalAmount,
      s.paymentMethod,
      `"${s.staffName}"`,
    ]);

    const csvContent = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `aquaflow-sales-${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  return (
    <div className="space-y-6">
      {/* Banner */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
        <div>
          <div className="flex items-center gap-2 text-cyan-600 text-xs font-bold uppercase tracking-wider mb-1">
            <TrendingUp className="w-4 h-4" />
            <span>Sales & Revenue Management</span>
          </div>
          <h2 className="text-xl font-black text-slate-900">
            Station Counter & Consolidated Vending Sales
          </h2>
          <p className="text-xs text-slate-500 mt-0.5">
            Audit daily transactions, generate printable tax receipts, and analyze gross revenues.
          </p>
        </div>

        <div className="flex flex-wrap items-center gap-2">
          <button
            type="button"
            onClick={handleExportCSV}
            className="flex items-center gap-1.5 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition-colors"
          >
            <FileSpreadsheet className="w-4 h-4 text-emerald-600" />
            <span>Export CSV</span>
          </button>

          <button
            type="button"
            onClick={onOpenPOS}
            className="flex items-center gap-1.5 px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all hover:scale-105"
          >
            <PlusCircle className="w-4 h-4" />
            <span>Open POS Register</span>
          </button>
        </div>
      </div>

      {/* Filter and Summary Bar */}
      <div className="flex flex-col md:flex-row items-center justify-between gap-3 bg-white p-3.5 rounded-2xl border border-slate-200">
        <div className="flex flex-wrap items-center gap-2 w-full md:w-auto flex-1">
          <div className="relative flex-1 min-w-[200px]">
            <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
            <input
              type="text"
              placeholder="Search transaction #, customer name, staff..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-cyan-500"
            />
          </div>

          <select
            value={filterType}
            onChange={(e) => setFilterType(e.target.value)}
            className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700"
          >
            <option value="all">All Sales Types</option>
            <option value="counter">Station Counter POS Only</option>
            <option value="vending">Vending Machine Collections</option>
          </select>

          <input
            type="date"
            value={dateFilter}
            onChange={(e) => setDateFilter(e.target.value)}
            className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700"
          />

          {dateFilter && (
            <button
              type="button"
              onClick={() => setDateFilter('')}
              className="text-xs text-slate-500 hover:underline"
            >
              Clear Date
            </button>
          )}
        </div>

        <div className="text-right shrink-0">
          <span className="text-[10px] text-slate-500 block uppercase font-medium">Filtered Total Sales:</span>
          <span className="text-lg font-black text-cyan-700">₱{totalFilteredSales.toLocaleString()}</span>
        </div>
      </div>

      {/* Transactions Table */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs">
            <thead className="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200 uppercase text-[10px]">
              <tr>
                <th className="py-3 px-4">Transaction #</th>
                <th className="py-3 px-4">Date & Time</th>
                <th className="py-3 px-4">Customer / Source</th>
                <th className="py-3 px-4">Items / Dispensed</th>
                <th className="py-3 px-4">Payment</th>
                <th className="py-3 px-4">Cashier / Staff</th>
                <th className="py-3 px-4 text-right">Total Amount</th>
                <th className="py-3 px-4 text-right">Receipt</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filteredSales.map((sale) => (
                <tr key={sale.id} className="hover:bg-slate-50/70 transition-colors">

                    <div>{sale.date}</div>

                  </td>
                  <td className="py-3 px-4">
                    <div className="font-bold text-slate-900 flex items-center gap-1.5">
                      <span>{sale.customerName}</span>
                      {sale.isVendingMachineConsolidated && (
                        <span className="px-1.5 py-0.2 bg-purple-100 text-purple-700 rounded text-[9px] font-bold">
                          Vending
                        </span>

      return (
        <LandingPage
          onNavigateToLogin={() => setAuthLandingPage('login')}
          onNavigateToRegister={() => setAuthLandingPage('register')}
        />
      );

      return (
        <RegisterPage
          onNavigateToLogin={() => setAuthLandingPage('login')}
          onNavigateToLanding={() => setAuthLandingPage('landing')}
          onSuccess={() => setActiveTab('dashboard')}
        />
      );

      <LoginPage
        onNavigateToRegister={() => setAuthLandingPage('register')}

        onSuccess={() => setActiveTab('dashboard')}

        { id: 'map', label: 'Location Map Studio', icon: Compass },

    },
    {

        { id: 'containers', label: 'Container Tracking', icon: Droplets },
        { id: 'inventory', label: 'Inventory & Supplies', icon: Package, badge: lowStockCount > 0 ? lowStockCount : undefined },

    },
    {
      group: 'Business & CRM',
      items: [
        { id: 'customers', label: 'Customer Directory', icon: Users },
        { id: 'sales', label: 'Sales Transactions', icon: TrendingUp },
        { id: 'reports', label: 'Reports & Analytics', icon: FileText },

      group: 'Administration',

        { id: 'settings', label: 'Settings & Logs', icon: Settings },

  ]
    .map((group) => {

      if (currentUser.role === 'delivery') {
        items = items
          .filter((item) => ['dashboard', 'deliveries', 'map', 'containers'].includes(item.id))
          .map((item) => (item.id === 'dashboard' ? { ...item, label: 'Rider Dispatch Console' } : item));
      } else if (currentUser.role === 'staff') {
        items = items
          .filter((item) => !['staff', 'settings'].includes(item.id))
          .map((item) => (item.id === 'dashboard' ? { ...item, label: 'Staff Desk Dashboard' } : item));
      } else if (currentUser.role === 'admin') {
        items = items.map((item) =>
          item.id === 'dashboard' ? { ...item, label: 'Administrator Dashboard' } : item
        );
      }
      return { ...group, items };
    })

  // Flatten allowed item IDs for current user's role
  const allowedItemIds = navigationGroups.flatMap((g) => g.items.map((i) => i.id));
  const effectiveActiveTab = allowedItemIds.includes(activeTab) ? activeTab : 'dashboard';

              className="lg:hidden p-1.5 text-slate-400 hover:text-white rounded-lg"
            >
              <X className="w-5 h-5" />
            </button>
          </div>

          {/* Quick Action Button Inside Sidebar */}
          {!isSidebarCollapsed && (currentUser.role === 'admin' || currentUser.role === 'staff') && (
            <div className="p-3 border-b border-slate-800/60">
              <button
                type="button"
                onClick={() => {
                  setIsPOSOpen(true);
                  setIsMobileMenuOpen(false);
                }}
                className="w-full py-2.5 px-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-md shadow-cyan-600/20 flex items-center justify-center gap-2 transition-all hover:scale-[1.02] cursor-pointer"
              >
                <ShoppingCart className="w-4 h-4" />
                <span>Open POS Counter</span>
              </button>
            </div>
          )}

          {/* Navigation Groups */}
          <div className="flex-1 overflow-y-auto py-3 px-3 space-y-4">
            {navigationGroups.map((group) => (
              <div key={group.group} className="space-y-1">
                {!isSidebarCollapsed && (
                  <div className="px-2 text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                    {group.group}
                  </div>
                )}
                {group.items.map((item) => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;

                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => {
                        setActiveTab(item.id);
                        setIsMobileMenuOpen(false);
                      }}
                      title={isSidebarCollapsed ? item.label : undefined}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all cursor-pointer ${
                        isActive
                          ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/20'
                          : 'text-slate-400 hover:text-white hover:bg-slate-900'
                      } ${isSidebarCollapsed ? 'justify-center px-0' : ''}`}
                    >
                      <Icon className="w-4 h-4 shrink-0" />
                      {!isSidebarCollapsed && (
                        <span className="truncate flex-1 text-left">{item.label}</span>
                      )}
                      {!isSidebarCollapsed && item.badge !== undefined && (
                        <span
                          className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${
                            isActive
                              ? 'bg-white text-cyan-900'
                              : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                          }`}
                        >
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            ))}
          </div>

          {/* Sidebar Bottom Footer Toggle & Status */}
          <div className="p-3 border-t border-slate-800/80 shrink-0 space-y-2">
            {!isSidebarCollapsed && (
              <div className="px-2 text-[10px] text-slate-400 flex items-center justify-between">
                <span>DOH Certified</span>
                <span className="text-cyan-400 font-mono">16-Stage R.O.</span>
              </div>
            )}

            <button
              type="button"
              onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}
              className="hidden lg:flex w-full items-center justify-center py-2 text-slate-400 hover:text-white hover:bg-slate-900 rounded-xl text-xs transition-colors cursor-pointer"
              title={isSidebarCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'}
            >
              {isSidebarCollapsed ? (
                <ChevronRight className="w-4 h-4" />
              ) : (
                <div className="flex items-center gap-2">
                  <ChevronLeft className="w-4 h-4" />
                  <span>Collapse Menu</span>
                </div>
              )}
            </button>
          </div>
        </aside>
      )}

      {/* Main Layout Area */}
      <div className="flex-1 flex flex-col min-w-0">
        {/* Top Header Navbar */}
        <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 h-16 shrink-0">
          <div className="px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between gap-4">
            {/* Left Toggle & Breadcrumb View Title */}
            <div className="flex items-center gap-3">
              <button
                type="button"
                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                className="lg:hidden p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
              >
                <Menu className="w-5 h-5" />
              </button>

              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 font-medium hidden sm:inline">
                  AquaFabz
                </span>
                <span className="text-xs text-slate-300 hidden sm:inline">/</span>
                <h2 className="font-bold text-slate-900 text-sm tracking-tight">
                  {currentUser.role === 'customer' ? 'Customer Self-Service Portal' : currentTabLabel}
                </h2>
              </div>
            </div>

            {/* Right Action Buttons, Notifications, User Menu */}
            <div className="flex items-center gap-2.5">
              {(currentUser.role === 'admin' || currentUser.role === 'staff') && (
                <>
                  <button
                    type="button"
                    onClick={() => setIsPOSOpen(true)}
                    className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-xs shadow-xs transition-all hover:scale-105 cursor-pointer"
                  >
                    <ShoppingCart className="w-3.5 h-3.5" />
                    <span>POS Counter</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setIsNewOrderOpen(true)}
                    className="hidden md:flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-xs transition-all hover:scale-105 cursor-pointer"
                  >
                    <Truck className="w-3.5 h-3.5" />
                    <span>New Delivery</span>
                  </button>
                </>
              )}

                  {/* Notification Alerts Bell & Popover */}
                  {currentUser.role !== 'customer' && (
                    <div className="relative">
                    <button
                      type="button"
                      onClick={() => setIsAlertsOpen(!isAlertsOpen)}
                      className="p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl relative transition-colors cursor-pointer"
                      title={`${totalAlerts} Pending Alerts`}
                    >
                      <Bell className="w-4 h-4" />
                      {totalAlerts > 0 && (
                        <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full" />
                      )}
                    </button>

                    {isAlertsOpen && (
                      <div className="absolute right-0 mt-2 w-72 bg-white rounded-2xl shadow-xl border border-slate-200 p-3 z-50 text-xs space-y-2">
                        <div className="font-bold text-slate-900 border-b border-slate-100 pb-1.5 flex items-center justify-between">
                          <span>Operational Alerts</span>
                          <span className="text-[10px] font-mono text-slate-500">{totalAlerts} total</span>
                        </div>
                        {totalAlerts === 0 ? (
                          <div className="text-slate-400 py-3 text-center">No active alerts. All systems normal.</div>
                        ) : (
                          <div className="space-y-1.5">
                            {pendingOrdersCount > 0 && (
                              <div
                                onClick={() => {
                                  setActiveTab('deliveries');
                                  setIsAlertsOpen(false);
                                }}
                                className="p-2 bg-indigo-50 hover:bg-indigo-100 rounded-lg cursor-pointer text-indigo-900 flex items-center justify-between"
                              >
                                <span>{pendingOrdersCount} pending deliveries</span>
                                <ChevronRight className="w-3.5 h-3.5" />
                              </div>
                            )}
                            {lowStockCount > 0 && (
                              <div
                                onClick={() => {
                                  setActiveTab('inventory');
                                  setIsAlertsOpen(false);
                                }}
                                className="p-2 bg-amber-50 hover:bg-amber-100 rounded-lg cursor-pointer text-amber-900 flex items-center justify-between"
                              >
                                <span>{lowStockCount} items at low stock</span>
                                <ChevronRight className="w-3.5 h-3.5" />
                              </div>
                            )}
                            {lowVendingCount > 0 && (
                              <div
                                onClick={() => {
                                  setActiveTab('vending');
                                  setIsAlertsOpen(false);
                                }}
                                className="p-2 bg-rose-50 hover:bg-rose-100 rounded-lg cursor-pointer text-rose-900 flex items-center justify-between"
                              >
                                <span>{lowVendingCount} vending units low water</span>
                                <ChevronRight className="w-3.5 h-3.5" />
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}

              {/* User Session Menu */}
              <div className="relative">
                <button
                  type="button"
                  onClick={() => setIsUserMenuOpen(!isUserMenuOpen)}
                  className="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs transition-colors cursor-pointer"
                >
                  <div className="w-6 h-6 rounded-lg bg-gradient-to-tr from-cyan-600 to-indigo-600 text-white font-bold text-[10px] flex items-center justify-center">
                    {currentUser.name[0]}
                  </div>
                  <div className="text-left hidden sm:block">
                    <div className="font-bold text-slate-800 text-[11px] leading-tight truncate max-w-[120px]">
                      {currentUser.name}
                    </div>
                    <div className="text-[10px] text-slate-400 capitalize">{currentUser.role}</div>
                  </div>
                  <ChevronDown className="w-3.5 h-3.5 text-slate-400" />
                </button>

                {isUserMenuOpen && (
                  <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-slate-200 p-3 z-50 text-xs space-y-3">
                    <div className="px-1 py-1">
                      <p className="font-bold text-slate-900 text-sm">{currentUser.name}</p>
                      <p className="text-[11px] text-slate-500">{currentUser.email || 'authenticated@aquafabz.com'}</p>
                      <div className="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-md text-[10px] font-extrabold uppercase bg-cyan-100 text-cyan-900 border border-cyan-200">
                        Authenticated Role: {currentUser.role}
                      </div>
                    </div>

                    {/* ADMIN EXCEPTION: Admin can simulate other roles without signing out */}
                    {(currentUser.role === 'admin' || currentUser.username === 'admin') && (
                      <div className="pt-2 border-t border-slate-100 space-y-1.5">
                        <div className="flex items-center justify-between text-[11px] font-bold text-cyan-800">
                          <span>👑 Admin Simulation Override:</span>
                          <span className="text-[9px] px-1.5 py-0.5 bg-cyan-50 rounded text-cyan-700">Admin Only</span>
                        </div>
                        <p className="text-[10px] text-slate-400">
                          As Administrator, you can simulate and preview other role dashboards:
                        </p>
                        <div className="space-y-1 max-h-36 overflow-y-auto">
                          {users.map((u) => (
                            <button
                              key={u.id}
                              type="button"
                              onClick={() => {
                                setCurrentUser(u);
                                setIsUserMenuOpen(false);
                              }}
                              className={`w-full text-left px-2.5 py-1.5 rounded-lg flex items-center justify-between text-xs transition-colors cursor-pointer ${
                                u.id === currentUser.id
                                  ? 'bg-cyan-50 text-cyan-800 font-bold border border-cyan-200'
                                  : 'hover:bg-slate-50 text-slate-700'
                              }`}
                            >
                              <span className="truncate">{u.name}</span>
                              <span className="text-[9px] uppercase font-mono font-bold text-slate-400">{u.role}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className="pt-2 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => {
                          setIsUserMenuOpen(false);
                          logout();
                        }}
                        className="w-full py-2 px-3 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-xs transition-colors flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <LogOut className="w-3.5 h-3.5" />
                        <span>Sign Out / Log Out</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Explicit Log Out button on Header */}
              <button
                type="button"
                onClick={logout}
                title="Log Out to Landing"
                className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors cursor-pointer"
              >
                <LogOut className="w-4 h-4" />
              </button>
            </div>
          </div>
        </header>

        {/* Main Content Viewport */}
        <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
          {currentUser.role === 'customer' ? (
            <CustomerPortalView />
          ) : (
            <>
              {effectiveActiveTab === 'dashboard' && (
                <Dashboard
                  onNavigate={(tab) => setActiveTab(tab)}
                  onOpenPOS={() => setIsPOSOpen(true)}
                  onOpenNewOrder={() => setIsNewOrderOpen(true)}
                  onOpenVendingRecord={() => setActiveTab('vending')}
                />
              )}

              {effectiveActiveTab === 'deliveries' && <DeliveryView />}
              {effectiveActiveTab === 'map' && <LocationMapView />}
              {effectiveActiveTab === 'vending' && <VendingView />}
              {effectiveActiveTab === 'containers' && <ContainerView />}
              {effectiveActiveTab === 'inventory' && <InventoryView />}
              {effectiveActiveTab === 'customers' && <CustomerView />}
              {effectiveActiveTab === 'sales' && <SalesView onOpenPOS={() => setIsPOSOpen(true)} />}
              {effectiveActiveTab === 'reports' && <ReportsView />}
              {effectiveActiveTab === 'staff' && <StaffView />}
              {effectiveActiveTab === 'settings' && <SettingsView />}
            </>
          )}
        </main>

        {/* Clean Footer Branding */}
        <footer className="mt-auto border-t border-slate-200/80 bg-white py-4 text-center text-xs text-slate-500">
          <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>
              <strong>AquaFabz</strong> · Sales, Inventory, Customer & Location Mapping Management System
            </div>
            <div className="text-[11px] text-slate-400">
              AquaFabz Central Hub · Water Refilling Station Platform
            </div>
          </div>
        </footer>
      </div>

      {/* Floating Action Button for Mobile Quick POS */}
      {(currentUser.role === 'admin' || currentUser.role === 'staff') && (
        <div className="lg:hidden fixed bottom-5 right-5 z-40">
          <button
            type="button"
            onClick={() => setIsPOSOpen(true)}
            className="w-13 h-13 rounded-2xl bg-cyan-600 text-white shadow-xl flex items-center justify-center font-bold hover:scale-105 active:scale-95 transition-all cursor-pointer"
            title="POS Counter"
          >
            <ShoppingCart className="w-6 h-6" />
          </button>
        </div>
      )}

      {/* Global Modals */}
      <POSModal isOpen={isPOSOpen} onClose={() => setIsPOSOpen(false)} />
      <NewOrderModal isOpen={isNewOrderOpen} onClose={() => setIsNewOrderOpen(false)} />
      <PrintModal />
      <ConfirmModal />
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <MainApp />
    </AppProvider>
  );
}


    const rootEl = document.getElementById("root");
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      ReactDOM.render(<App />, rootEl);
    }

    </script>
  </body>
</html>
